name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shinylive
        run: pip install shinylive

      - name: Assemble app folder
        run: |
          mkdir -p build
          cp app.py about.md cpg_targets.json model_summary.json requirements.txt build/
          rsync -a --prune-empty-dirs \
            --include='*/' \
            --include='plots/*.png' \
            --include='results/statistics_*.csv' \
            --exclude='*' \
            results/ build/results/

      - name: Export with shinylive
        run: shinylive export build site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4